<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn</title>
    <link rel="stylesheet" href="styles.css">
    <script src="env.js"></script>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <h1 class="title">Saturn</h1>

            <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle theme">
                <!-- Sun -->
                <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12Zm0-16v2m0 16v2M4 12H2m20 0h-2M5.64 5.64 4.22 4.22m15.56 15.56-1.42-1.42M18.36 5.64l1.42-1.42M4.22 19.78l1.42-1.42"
                        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>

                <!-- Moon -->
                <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 14.5A7.5 7.5 0 0 1 9.5 3a6.5 6.5 0 1 0 11.5 11.5Z"
                        fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </header>

        <div class="controls">
            <button id="toggleSelectionBtn" class="btn-secondary">Toggle Selection Mode</button>
        </div>

        <div class="section">
            <h3>Selected Messages</h3>
            <div id="messageList" class="message-list">
                <!-- Messages will be injected here -->
                <div class="empty-state">No messages selected yet.</div>
            </div>
        </div>

        <div class="section">
            <h3>Configuration</h3>
            <p style="font-size: 12px; color: var(--muted); margin: 0;">Settings loaded from <code>env.js</code></p>
        </div>

        <div class="section">
            <h3>Context / Debate Notes</h3>
            <textarea id="contextInput" placeholder="E.g., I ignored him for 5 hours, should I reply?"></textarea>
        </div>

        <div class="actions">
            <button id="analyzeBtn" class="btn-primary">ANALYZE TIMING</button>
        </div>

        <div id="loadingIndicator" class="hidden">
            <div class="spinner"></div>
            <p>Consulting the Strategist...</p>
        </div>

        <div id="resultContainer" class="result-container hidden">
            <div class="traffic-light">
                <div id="lightRed" class="light red"></div>
                <div id="lightYellow" class="light yellow"></div>
                <div id="lightGreen" class="light green"></div>
            </div>
            <h2 id="resultHeadline" class="result-headline"></h2>
            
            <div class="analysis-grid">
                <div class="stat-box">
                    <span class="label">Silence</span>
                    <span id="statSilence" class="value">--</span>
                </div>
                <div class="stat-box">
                    <span class="label">Power</span>
                    <span id="statPower" class="value">--</span>
                </div>
            </div>

            <div class="analysis-text">
                <h4>Analysis</h4>
                <p id="resultReasoning"></p>
            </div>

            <div class="recommendation-box">
                <h4>Recommendation</h4>
                <p id="resultRecommendation"></p>
            </div>
        </div>

        <div id="chatSection" class="section hidden">
            <h3>Strategist Chat</h3>
            <div id="chatHistory" class="chat-history"></div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Ask a follow-up...">
                <button id="sendChatBtn">Send</button>
            </div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
